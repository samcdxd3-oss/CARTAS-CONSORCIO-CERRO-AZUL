<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro de Cartas — Consorcio Cerro Azul</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0A3C8B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cartas CCA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-dim:#EAF3FD;
    --ink:#0A3C8B;
    --ink-soft:#1360B9;
    --stamp-orange:#238DF0;
    --stamp-teal:#238DF0;
    --stamp-error:#D64545;
    --celeste:#92C6F9;
    --line:#D7E6FA;
    --card:#FFFFFF;
    --cat-municipalidad:#0A3C8B;
    --cat-supervision:#0E8F82;
    --cat-otros:#B8860B;
    --cat-emitida:#7C3AED;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
  }
  header{
    position:sticky; top:0; z-index:20;
    background:var(--ink);
    color:var(--paper);
    padding:14px 16px 0 16px;
  }
  .titlebar{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:10px;
  }
  .titlebar h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px; margin:0; letter-spacing:.2px;
  }
  .titlebar .sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:#B9C2CE; opacity:.85;
  }
  .tabs{
    display:flex; gap:4px; overflow-x:auto;
  }
  .tab{
    flex:0 0 auto;
    padding:10px 14px 12px 14px;
    font-family:'Space Grotesk',sans-serif;
    font-size:13px; font-weight:600;
    color:#B9C2CE;
    border-bottom:3px solid transparent;
    cursor:pointer; white-space:nowrap;
  }
  .tab.active{
    color:#fff;
    border-bottom:3px solid var(--stamp-orange);
  }
  .searchwrap{
    position:sticky; top:66px; z-index:19;
    background:var(--paper);
    padding:12px 16px 8px 16px;
    border-bottom:1px solid var(--line);
  }
  #buscador{
    width:100%; padding:13px 14px;
    font-size:16px; font-family:'Inter',sans-serif;
    border:2px solid var(--ink); border-radius:10px;
    background:var(--card);
  }
  #buscador:focus{ outline:2px solid var(--stamp-teal); }
  .chips{
    display:flex; gap:8px; margin-top:10px; overflow-x:auto;
  }
  .chip{
    flex:0 0 auto;
    font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; font-weight:600;
    padding:6px 12px; border-radius:20px;
    border:1.5px solid var(--ink-soft);
    color:var(--ink-soft);
    cursor:pointer; background:transparent;
  }
  .chip.on{
    background:var(--ink); color:var(--paper); border-color:var(--ink);
  }
  main{ padding:14px 16px 60px 16px; max-width:820px; margin:0 auto; }
  .count{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--ink-soft); margin:4px 2px 14px 2px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
    margin-bottom:12px;
    position:relative;
    overflow:hidden;
  }
  .card-top{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .numero{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:13.5px;
    background:var(--ink); color:var(--paper);
    padding:3px 9px; border-radius:6px;
  }
  .fecha{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px; color:var(--ink-soft);
  }
  .asunto{ font-size:14.5px; line-height:1.4; margin:4px 0 8px 0; }
  .stamp{
    position:absolute; top:10px; right:12px;
    font-family:'Space Grotesk',sans-serif;
    font-size:9.5px; font-weight:700; letter-spacing:.5px;
    text-transform:uppercase;
    padding:4px 8px; border-radius:5px;
    transform:rotate(4deg);
    border:1.5px solid currentColor;
    opacity:.85;
  }
  .stamp.municipalidad{ color:var(--cat-municipalidad); border-color:var(--cat-municipalidad); }
  .stamp.supervision{ color:var(--cat-supervision); border-color:var(--cat-supervision); }
  .stamp.otros{ color:var(--cat-otros); border-color:var(--cat-otros); }
  .stamp.emitida{ color:var(--cat-emitida); border-color:var(--cat-emitida); }
  a.link{
    display:inline-flex; align-items:center; gap:6px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12.5px; font-weight:600;
    color:var(--stamp-teal); text-decoration:none;
  }
  a.link:active{ opacity:.6; }
  .bloque{
    border:1px solid var(--line); border-radius:12px;
    margin-bottom:16px; overflow:hidden;
  }
  .bloque-header{
    padding:10px 14px; font-family:'Space Grotesk',sans-serif;
    font-weight:700; font-size:14px; color:#fff;
  }
  .bloque-subtitulo{
    font-family:'Inter',sans-serif; font-weight:500;
    font-size:12px; margin-top:3px; opacity:.92;
    text-transform:none; letter-spacing:0; line-height:1.35;
  }
  .bloque-fila{
    display:grid; grid-template-columns:78px 1fr;
    gap:10px; padding:8px 14px; font-size:13px;
    border-top:1px solid var(--paper-dim);
  }
  .bloque-fila .label{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); }
  .estado{ text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:14px; }
  .estado.error{ color:var(--stamp-error); }

  .formulario{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  .formulario label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft); margin:14px 0 5px 0; }
  .formulario label:first-child{ margin-top:0; }
  .formulario input[type=text], .formulario input[type=date], .formulario input[type=password],
  .formulario textarea, .formulario select{
    width:100%; padding:11px 12px; font-size:15px; font-family:'Inter',sans-serif;
    border:1.5px solid var(--line); border-radius:8px; background:var(--paper);
  }
  .formulario textarea{ resize:vertical; min-height:70px; }
  .segmentado{ display:flex; gap:8px; }
  .segmentado button{
    flex:1; padding:10px; border-radius:8px; border:1.5px solid var(--ink);
    background:transparent; color:var(--ink); font-weight:600; font-size:13px; cursor:pointer;
  }
  .segmentado button.on{ background:var(--ink); color:var(--paper); }
  .btn-guardar{
    width:100%; margin-top:18px; padding:14px; border-radius:10px; border:none;
    background:var(--stamp-orange); color:#fff; font-weight:700; font-size:15px; cursor:pointer;
  }
  .btn-guardar:disabled{ opacity:.5; }
  .msg-form{ margin-top:12px; font-size:13px; text-align:center; }
  .msg-form.ok{ color:var(--stamp-teal); }
  .msg-form.err{ color:var(--stamp-error); }

  .dropzone{
    border:2.5px dashed var(--ink-soft); border-radius:12px;
    padding:26px 16px; text-align:center; cursor:pointer;
    background:var(--paper); margin-bottom:6px; transition:.15s;
  }
  .dropzone.arrastrando{ border-color:var(--stamp-orange); background:var(--paper-dim); }
  .dropzone .icono{ font-size:26px; display:block; margin-bottom:6px; }
  .dropzone .texto{ font-size:13px; color:var(--ink-soft); }
  .gate{ text-align:center; padding:20px 4px; }
  .gate p{ font-size:14px; color:var(--ink-soft); margin-bottom:16px; }
  .gate input{ text-align:center; font-size:20px; letter-spacing:4px; }

  .panel-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .btn-secundario{
    padding:9px 14px; border-radius:8px; border:1.5px solid var(--ink); background:transparent;
    color:var(--ink); font-weight:600; font-size:12.5px; cursor:pointer; font-family:'IBM Plex Mono',monospace;
  }
  .grid-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:10px; background:var(--card); }
  table.grid{ border-collapse:collapse; width:100%; min-width:900px; font-size:12.5px; }
  table.grid th{
    background:var(--ink); color:var(--paper); font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; text-align:left; padding:8px 6px; white-space:nowrap; position:sticky; top:0;
  }
  table.grid td{ border-bottom:1px solid var(--paper-dim); padding:3px; vertical-align:top; }
  table.grid input{
    width:100%; border:1px solid transparent; background:transparent; padding:9px 8px; font-size:13.5px;
    font-family:'Inter',sans-serif; border-radius:5px;
  }
  table.grid input:focus{ border-color:var(--stamp-teal); background:var(--paper); outline:none; }
  table.grid tr.nueva td{ background:#EAF3FD; }
  td.col-guardar{ text-align:center; width:70px; white-space:nowrap; }
  .btn-fila{
    width:32px; height:32px; border-radius:7px; border:none; background:var(--ink); color:#fff;
    cursor:pointer; font-size:14px; margin:0 2px;
  }
  .btn-fila.ok{ background:var(--stamp-teal); }
  .btn-fila.err{ background:var(--stamp-error); }
  .btn-fila.borrar{ background:transparent; color:var(--stamp-error); border:1.5px solid var(--stamp-error); }
  .btn-secundario:disabled{ opacity:.4; cursor:default; }

  #btnScroll{
    position:fixed; bottom:22px; right:18px; z-index:30;
    width:52px; height:52px; border-radius:50%; border:none;
    background:var(--ink); color:var(--paper); font-size:20px;
    box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; display:none;
  }

  .overlay-modal{
    position:fixed; inset:0; background:rgba(10,60,139,.45);
    z-index:50; display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .modal-panel{
    background:var(--card); border-radius:14px; padding:20px;
    max-width:1180px; width:100%; max-height:92vh; overflow-y:auto;
    box-shadow:0 12px 40px rgba(0,0,0,.3);
  }
  .modal-body{ display:flex; gap:20px; align-items:flex-start; }
  .modal-preview{ flex:0 0 54%; max-height:82vh; overflow-y:auto; border-radius:8px; }
  .modal-preview img{ width:100%; border-radius:8px; border:1px solid var(--line); display:block; }
  .modal-fields{ flex:1; min-width:0; max-height:82vh; overflow-y:auto; padding-right:6px; }
  @media (max-width: 760px){
    .modal-body{ flex-direction:column; }
    .modal-preview{ flex:none; width:100%; max-height:340px; }
    .modal-fields{ max-height:none; overflow-y:visible; }
  }
  .modal-panel h3{ font-family:'Space Grotesk',sans-serif; font-size:16px; margin:0 0 4px 0; color:var(--ink); }
  .modal-panel .archivo-nombre{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-bottom:14px; word-break:break-all; }
  .modal-panel label{ display:block; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin:12px 0 4px 0; }
  .modal-panel input, .modal-panel select, .modal-panel textarea{
    width:100%; padding:10px 11px; font-size:14.5px; font-family:'Inter',sans-serif;
    border:1.5px solid var(--line); border-radius:8px; background:var(--paper);
  }
  .modal-botones{ display:flex; gap:10px; margin-top:18px; }
  .modal-botones button{ flex:1; padding:12px; border-radius:9px; font-weight:700; font-size:14px; cursor:pointer; border:none; }
  .modal-botones .cancelar{ background:transparent; border:1.5px solid var(--ink-soft); color:var(--ink-soft); }
  .modal-botones .confirmar{ background:var(--stamp-orange); color:#fff; }
  .modal-aviso{ font-size:12px; color:var(--ink-soft); background:var(--paper-dim); padding:8px 10px; border-radius:8px; margin-top:4px; }
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>Registro de Cartas</h1>
    <img src="logo.png" alt="Consorcio Cerro Azul" style="height:34px;width:auto;">
  </div>
  <div class="tabs">
    <div class="tab active" data-tab="recibidas">Recibidas</div>
    <div class="tab" data-tab="emitidas">Emitidas</div>
    <div class="tab" data-tab="consultas">Consultas</div>
    <div class="tab" data-tab="editar">+ Agregar</div>
  </div>
</header>

<div class="searchwrap">
  <input id="buscador" type="text" placeholder="Buscar por N°, asunto, fecha, entidad..." autocomplete="off">
  <div class="chips" id="chipsRecibidas">
    <div class="chip" data-ent="MUNICIPALIDA">Municipalidad</div>
    <div class="chip" data-ent="ANANEA">Supervisión</div>
    <div class="chip" data-ent="OTROS">Otros</div>
  </div>
</div>

<main id="main">
  <div class="estado" id="estadoCarga">Cargando datos desde Google Sheets...</div>
</main>

<button id="btnScroll" onclick="toggleScroll()">↓</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// =====================================================================
// PEGA AQUÍ LA URL DE TU APPS SCRIPT WEB APP (después de "Implementar")
// =====================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbwdZJSTgOjqlIad6Av3lRfw7jgELmS4vCzk7SHByXhJ2KbtNXvgeR6jGiCnfKEektMb0w/exec";

let DATA = { emitidas: [], recibidas: [] };
let currentTab = "recibidas";
let entidadFiltro = null;
let tipoFormulario = "recibida";
let panelDesbloqueado = false;
let pinSesion = "";

pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
let archivoSeleccionado = null;

async function cargarDatos() {
  try {
    const res = await fetch(API_URL, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
    render();
  } catch (err) {
    document.getElementById("main").innerHTML =
      `<div class="estado error">No se pudo cargar la información.<br>Revisa que la URL del API_URL en el código sea correcta y que el despliegue esté activo.<br><br><span style="font-family:'IBM Plex Mono',monospace;font-size:11px">${err.message}</span></div>`;
  }
}

document.querySelectorAll(".tab").forEach(t => {
  t.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(x => x.classList.remove("active"));
    t.classList.add("active");
    currentTab = t.dataset.tab;
    document.getElementById("chipsRecibidas").style.display = currentTab === "recibidas" ? "flex" : "none";
    document.querySelector(".searchwrap").style.display = currentTab === "editar" ? "none" : "block";
    document.getElementById("main").style.maxWidth = currentTab === "editar" ? "1400px" : "820px";
    render();
    setTimeout(actualizarBotonScroll, 50);
  });
});

document.querySelectorAll(".chip").forEach(c => {
  c.addEventListener("click", () => {
    const val = c.dataset.ent;
    if (entidadFiltro === val) { entidadFiltro = null; c.classList.remove("on"); }
    else {
      document.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
      entidadFiltro = val; c.classList.add("on");
    }
    render();
  });
});

document.getElementById("buscador").addEventListener("input", render);

function textoCoincide(campos, termino){
  if(!termino) return true;
  const t = termino.toUpperCase();
  return campos.some(c => String(c||"").toUpperCase().includes(t));
}

function render(){
  const termino = document.getElementById("buscador").value.trim();
  const main = document.getElementById("main");

  if(currentTab === "recibidas") return renderLista(DATA.recibidas, termino, main, "recibida");
  if(currentTab === "emitidas") return renderLista(DATA.emitidas, termino, main, "emitida");
  if(currentTab === "consultas") return renderConsultas(termino, main);
  if(currentTab === "editar") return renderFormulario(main);
}

function renderLista(lista, termino, main, tipo){
  let filtrada = lista.filter(item => {
    const campos = [item.numero, item.fecha, item.asunto, item.entidad || ""];
    const coincideTexto = textoCoincide(campos, termino);
    let coincideEntidad = true;
    if(tipo === "recibida" && entidadFiltro){
      const ent = (item.entidad||"").toUpperCase();
      if(entidadFiltro === "OTROS") coincideEntidad = !ent.includes("MUNICIPALIDA") && !ent.includes("ANANEA");
      else coincideEntidad = ent.includes(entidadFiltro);
    }
    return coincideTexto && coincideEntidad;
  });

  let html = `<div class="count">${filtrada.length} carta${filtrada.length===1?"":"s"} encontrada${filtrada.length===1?"":"s"}</div>`;

  if(filtrada.length === 0){
    html += mensajeVacio(termino, entidadFiltro);
  } else {
    filtrada.forEach(item => {
      const stampClass = tipo === "emitida" ? "emitida" :
        (item.entidad||"").toUpperCase().includes("MUNICIPALIDA") ? "municipalidad" :
        (item.entidad||"").toUpperCase().includes("ANANEA") ? "supervision" : "otros";
      const stampText = tipo === "emitida" ? "EMITIDA" :
        (item.entidad||"").toUpperCase().includes("MUNICIPALIDA") ? "MUNICIPALIDAD" :
        (item.entidad||"").toUpperCase().includes("ANANEA") ? "SUPERVISIÓN" : "OTRO";

      html += `
        <div class="card">
          <span class="stamp ${stampClass}">${stampText}</span>
          <div class="card-top">
            <span class="numero">N° ${item.numero}</span>
            <span class="fecha">${item.fecha}</span>
          </div>
          <div class="asunto">${escapeHtml(item.asunto)}</div>
          ${tipo === "emitida" && item.entidad ? `<div style="font-size:12px;color:var(--ink-soft);margin-bottom:6px;">Para: ${escapeHtml(item.entidad)}</div>` : ""}
          <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;">
            ${item.link ? `<a class="link" href="${item.link}" target="_blank" rel="noopener">📄 Ver PDF →</a>` : ""}
            <button type="button" onclick="abrirReferenciasPorNumero('${escapeAtributo(item.numero)}','${tipo}')" style="background:transparent;border:none;color:var(--ink-soft);font-family:'IBM Plex Mono',monospace;font-size:12.5px;font-weight:600;cursor:pointer;padding:0;">🔗 Relacionados</button>
          </div>
        </div>`;
    });
  }
  main.innerHTML = html;
}

// ---- Cruce de Consultas (replica ejecutarCruceDeDatos, en JS) ----
// La 1ra carta que menciona "CONSULTA N°X" (recorriendo Emitidas en orden)
// queda FIJA como EMITIDA. Todo lo demás (más emitidas + recibidas) son
// seguimientos, y esos sí se ordenan por fecha real (no como texto).
const REGEX_CONSULTA = /CONSULTA[S]?[^\d]*((?:\d+[\s,yYeEnN°º]*)+)/i;

function fechaAValor(fechaStr){
  if(!fechaStr) return 0;
  const partes = String(fechaStr).trim().split("/");
  if(partes.length === 3){
    const t = new Date(partes[2], partes[1] - 1, partes[0]).getTime();
    return isNaN(t) ? 0 : t;
  }
  const t = new Date(fechaStr).getTime();
  return isNaN(t) ? 0 : t;
}

function construirConsultas(){
  const dict = {};

  DATA.emitidas.forEach(item => {
    const m = String(item.asunto || "").match(REGEX_CONSULTA);
    if(!m) return;
    const conOrigen = { ...item, _tipo: "emitida" };
    const nums = m[1].match(/\d+/g) || [];
    nums.forEach(nStr => {
      const n = parseInt(nStr, 10);
      if(!dict[n]) dict[n] = { emitida: conOrigen, seguimientos: [] };
      else dict[n].seguimientos.push(conOrigen);
    });
  });

  DATA.recibidas.forEach(item => {
    const m = String(item.asunto || "").match(REGEX_CONSULTA);
    if(!m) return;
    const conOrigen = { ...item, _tipo: "recibida" };
    const nums = m[1].match(/\d+/g) || [];
    nums.forEach(nStr => {
      const n = parseInt(nStr, 10);
      if(dict[n]) dict[n].seguimientos.push(conOrigen);
    });
  });

  Object.values(dict).forEach(c => {
    c.seguimientos.sort((a, b) => fechaAValor(a.fecha) - fechaAValor(b.fecha));
  });

  return dict;
}

function badgeEntidad(it){
  if(it._tipo === "emitida"){
    return `<span class="stamp emitida" style="position:static;transform:none;display:inline-block;margin-left:8px;">EMITIDA</span>`;
  }
  const ent = (it.entidad || "").toUpperCase();
  if(ent.includes("MUNICIPALIDA")) return `<span class="stamp municipalidad" style="position:static;transform:none;display:inline-block;margin-left:8px;">MUNICIPALIDAD</span>`;
  if(ent.includes("ANANEA")) return `<span class="stamp supervision" style="position:static;transform:none;display:inline-block;margin-left:8px;">SUPERVISIÓN</span>`;
  return `<span class="stamp otros" style="position:static;transform:none;display:inline-block;margin-left:8px;">OTRO</span>`;
}

function filaBloque(label, it){
  return `<div class="bloque-fila">
    <span class="label">${label}</span>
    <span>N° ${it.numero} — ${it.fecha} — ${escapeHtml(it.asunto)}${badgeEntidad(it)}
      ${it.link ? ` · <a class="link" href="${it.link}" target="_blank" rel="noopener">PDF →</a>` : ""}
    </span>
  </div>`;
}

function renderConsultas(termino, main){
  const dict = construirConsultas();
  window._dictConsultas = dict;
  const claves = Object.keys(dict).map(Number).sort((a, b) => a - b);
  const paleta = ["#0A3C8B","#238DF0","#0E8F82","#1360B9","#7C3AED","#238DF0"];
  let html = "";
  let visibles = 0;

  claves.forEach((num, idx) => {
    const c = dict[num];
    const todos = [c.emitida, ...c.seguimientos];
    const campos = todos.flatMap(i => [i.numero, i.fecha, i.asunto, i.entidad || ""]);
    if(!textoCoincide(["CONSULTA " + num, ...campos], termino)) return;
    visibles++;
    const color = paleta[idx % paleta.length];

    html += `<div class="bloque">
      <div class="bloque-header" style="background:${color}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
          <div>
            CONSULTA N° ${String(num).padStart(2, "0")}
            <div class="bloque-subtitulo">${escapeHtml(c.emitida.asunto)}</div>
          </div>
          <div style="position:relative;">
            <button onclick="toggleMenuConsulta(${num})" style="background:rgba(255,255,255,.25);border:none;color:#fff;width:28px;height:28px;border-radius:6px;cursor:pointer;font-weight:700;">⋮</button>
            <div id="menuConsulta${num}" style="display:none;position:absolute;right:0;top:32px;background:#fff;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25);min-width:160px;z-index:15;overflow:hidden;">
              <button onclick="verReferencias(${num})" style="width:100%;text-align:left;padding:10px 12px;border:none;background:transparent;color:var(--ink);font-size:13px;cursor:pointer;">📎 Ver referencias</button>
            </div>
          </div>
        </div>
      </div>`;
    html += filaBloque("EMITIDA", c.emitida);
    c.seguimientos.forEach((it, i) => { html += filaBloque("SEGUIM. " + (i + 1), it); });
    html += `</div>`;
  });

  main.innerHTML = `<div class="count">${visibles} consulta${visibles===1?"":"s"} encontrada${visibles===1?"":"s"}</div>` +
    (visibles === 0 ? mensajeVacio(termino, null) : html);
}

function toggleMenuConsulta(num){
  document.querySelectorAll("[id^='menuConsulta']").forEach(m => {
    if(m.id !== "menuConsulta" + num) m.style.display = "none";
  });
  const menu = document.getElementById("menuConsulta" + num);
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}
document.addEventListener("click", (e) => {
  if(!e.target.closest("[id^='menuConsulta']") && e.target.tagName !== "BUTTON"){
    document.querySelectorAll("[id^='menuConsulta']").forEach(m => m.style.display = "none");
  }
});

function buscarCartaPorReferencia(clave){
  const [numero, anio] = clave.split("-");
  const todas = [
    ...DATA.emitidas.map(i => ({ ...i, _tipo: "emitida" })),
    ...DATA.recibidas.map(i => ({ ...i, _tipo: "recibida" }))
  ];
  return todas.find(it => it.numero === numero && String(it.fecha || "").includes(anio));
}

function esListaReferenciasValida(texto){
  if(!texto) return false;
  return /^\d{1,4}-20\d{2}(,\d{1,4}-20\d{2})*$/.test(texto.trim());
}

async function abrirReferenciasParaCarta(item){
  const overlay = document.createElement("div");
  overlay.className = "overlay-modal";
  overlay.onclick = (e) => { if(e.target === overlay) overlay.remove(); };
  overlay.innerHTML = `
    <div class="modal-panel" style="max-width:520px;">
      <h3>🔗 Documentos relacionados</h3>
      <div class="archivo-nombre">N° ${item.numero} — ${escapeHtml(item.asunto)}</div>
      <div id="cuerpoReferencias" style="margin-top:10px;">
        <div class="modal-aviso">🔍 Buscando cartas referentes a esta carta...</div>
      </div>
      <div class="modal-botones">
        <button class="confirmar" onclick="this.closest('.overlay-modal').remove()">Cerrar</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);

  let refsTexto = (item.referencias || "").trim();
  if(!esListaReferenciasValida(refsTexto)) refsTexto = ""; // descarta datos viejos/ajenos guardados en esa columna

  if(!refsTexto){
    if(!item.link){
      document.getElementById("cuerpoReferencias").innerHTML = `<div class="modal-aviso">Esta carta no tiene PDF vinculado — no se puede analizar.</div>`;
      return;
    }
    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "leerReferenciasDesdeLink", link: item.link })
      });
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || "No se pudo analizar el documento.");
      refsTexto = (data.datos && data.datos.referencias) || "";

      // Guardamos el resultado para la próxima vez (esto no necesita PIN: solo cachea
      // algo derivado del propio documento, no es una edición manual de datos)
      fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ accion: "guardarReferencias", tipo: item._tipo, numero: item.numero, referencias: refsTexto })
      }).catch(() => {});
      item.referencias = refsTexto;
    } catch (err) {
      document.getElementById("cuerpoReferencias").innerHTML = `<div class="modal-aviso">⚠️ No se pudo analizar el documento: ${escapeHtml(err.message)}</div>`;
      return;
    }
  }

  mostrarListaReferencias(refsTexto);
}

function abrirReferenciasPorNumero(numero, tipo){
  const lista = tipo === "emitida" ? DATA.emitidas : DATA.recibidas;
  const item = lista.find(i => i.numero === numero);
  if(!item) return;
  abrirReferenciasParaCarta({ ...item, _tipo: tipo });
}

function verReferencias(num){
  document.querySelectorAll("[id^='menuConsulta']").forEach(m => m.style.display = "none");
  const c = window._dictConsultas[num];
  abrirReferenciasParaCarta(c.emitida);
}

function mostrarListaReferencias(refsTexto){
  const claves = refsTexto ? refsTexto.split(",").filter(Boolean) : [];
  let filasHtml = "";

  if(claves.length === 0){
    filasHtml = `<div class="modal-aviso">No se detectaron referencias citadas en esta carta.</div>`;
  } else {
    claves.forEach(clave => {
      const encontrada = buscarCartaPorReferencia(clave);
      if(encontrada){
        filasHtml += `<div class="bloque-fila">
          <span class="label">N° ${clave.split("-")[0]}</span>
          <span>${escapeHtml(encontrada.asunto)} ${badgeEntidad({ _tipo: encontrada._tipo, entidad: encontrada.entidad })}
            ${encontrada.link ? ` · <a class="link" href="${encontrada.link}" target="_blank" rel="noopener">PDF →</a>` : ""}
          </span>
        </div>`;
      } else {
        filasHtml += `<div class="bloque-fila">
          <span class="label">N° ${clave.split("-")[0]}</span>
          <span style="color:var(--ink-soft);">No está en el sistema (puede ser de otra entidad, o aún no se subió)</span>
        </div>`;
      }
    });
  }

  const contenedor = document.getElementById("cuerpoReferencias");
  if(contenedor) contenedor.innerHTML = `<div class="bloque">${filasHtml}</div>`;
}

function mensajeVacio(termino, entidadFiltro){
  const totalCargado = DATA.recibidas.length + DATA.emitidas.length;

  if(totalCargado === 0){
    return `<div class="estado error">No se cargó ninguna carta desde Google Sheets.<br>
      Esto normalmente es un problema de conexión, no de datos.<br>
      <button onclick="location.reload()" style="margin-top:10px;padding:8px 16px;border-radius:8px;border:2px solid var(--stamp-error);background:transparent;color:var(--stamp-error);font-weight:600;">🔄 Reintentar</button></div>`;
  }

  let detalle = [];
  if(termino) detalle.push(`buscando "<b>${escapeHtml(termino)}</b>"`);
  if(entidadFiltro) detalle.push(`con el filtro "<b>${entidadFiltro === "OTROS" ? "Otros" : entidadFiltro === "MUNICIPALIDA" ? "Municipalidad" : "Supervisión"}</b>" activo`);

  return `<div class="estado">
    Sin resultados ${detalle.length ? detalle.join(" y ") : ""}.<br>
    <span style="font-size:12px">(Sí hay ${totalCargado} cartas cargadas en total — solo no coinciden con esto)</span><br>
    <button onclick="document.getElementById('buscador').value='';entidadFiltro=null;document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));render();"
      style="margin-top:10px;padding:8px 16px;border-radius:8px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;">✕ Limpiar búsqueda y filtros</button>
  </div>`;
}

function escapeHtml(str){
  return String(str||"").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[m]));
}

function filaHTML(f, cols, key, esNueva){

  }).join("");
  const botonAbrir = `<button type="button" class="btn-fila" style="background:transparent;color:var(--stamp-teal);border:1.5px solid var(--stamp-teal);" onclick="abrirLinkFila('${key}')" title="Abrir PDF">🔗</button>`;
  const accionBorrar = esNueva ? `eliminarFilaNueva('${key}')` : `eliminarFilaExistente('${key}')`;
  const botonBorrar = `<button class="btn-fila borrar" onclick="${accionBorrar}" title="Quitar esta carta">✕</button>`;
  return `<tr data-key="${key}" class="${esNueva ? 'nueva' : ''}">
    ${celdas}
    <td class="col-guardar">${botonAbrir}${botonBorrar}</td>

  try {

      method: "POST",

// ---- Lee el nombre del PDF igual que tu DRIVE.gs, para autocompletar una fila nueva ----
function parsearNombreArchivo(nombreOriginal){
  const nombre = nombreOriginal.toUpperCase();
  if(nombre.indexOf("CARTA") === -1) return null;

  const idxCarta = nombre.indexOf("CARTA");
  const matchNum = nombre.substring(idxCarta + 5).match(/\d+/);
  if(!matchNum) return null;
  const numero = parseInt(matchNum[0], 10).toString();

  let tipo = "recibida", entidad = "OTRO", asunto = nombreOriginal.replace(/\.pdf$/i, "");

  if(nombre.indexOf("CCA-") !== -1){
    tipo = "emitida";
    const partes = nombreOriginal.split(/CCA-/i);
    if(partes.length > 1) asunto = partes[1];
  } else if(nombre.indexOf("GDTI") !== -1 || nombre.indexOf("MUNICIPALIDAD") !== -1){
    tipo = "recibida"; entidad = "MUNICIPALIDAD DE CIUDAD NUEVA";
    const partes = nombreOriginal.split(/GDTI-/i);
    if(partes.length > 1) asunto = partes[1];
  } else if(nombre.indexOf("ANANEA") !== -1 || nombre.indexOf("CS-") !== -1){
    tipo = "recibida"; entidad = "CONSORCIO ANANEA (SUPERVISION)";
    const partes = nombreOriginal.split(/ANANEA-/i);
    if(partes.length > 1) asunto = partes[1];
  }

  asunto = asunto.replace(/\.pdf$/i, "").replace(/-?\s*20(24|25|26|27)\s*$/i, "").trim().replace(/^-+|-+$/g, "").trim();

  return { tipo, numero, entidad, asunto };
}

async function renderizarPrimeraPagina(file){
  try {
    const url = URL.createObjectURL(file);
    const pdf = await pdfjsLib.getDocument(url).promise;
    const page = await pdf.getPage(1);
    const viewport = page.getViewport({ scale: 2.0 });
    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext("2d"), viewport }).promise;
    URL.revokeObjectURL(url);
    return canvas.toDataURL("image/png");
  } catch (e) {
    console.warn("No se pudo previsualizar el PDF:", e);
    return null;
  }
}

async function manejarArchivo(file){
  document.getElementById("dropzoneTexto").textContent = "🔍 Leyendo el documento con OCR (unos segundos)...";
  document.getElementById("dropzone").classList.add("arrastrando");

  const [resultadoOCR, imagenPreview] = await Promise.all([
    (async () => {
      let parsed = null, textoLeido = "", errorServidor = "";
      try {
        const base64 = await archivoABase64(file);
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ accion: "leerPDF", pin: pinSesion, archivoBase64: base64, mimeType: file.type || "application/pdf" })
        });
        const data = await res.json();
        if(data.ok){ parsed = data.datos; textoLeido = data.textoLeido || ""; }
        else errorServidor = data.error || "Error desconocido del servidor.";
      } catch (e) {
        errorServidor = "Error de conexión: " + e.message;
      }
      return { parsed, textoLeido, errorServidor };
    })(),
    renderizarPrimeraPagina(file)
  ]);

  document.getElementById("dropzoneTexto").textContent = "Arrastra el PDF aquí, o toca para elegirlo";
  document.getElementById("dropzone").classList.remove("arrastrando");

  abrirModalRevision(file, resultadoOCR.parsed, resultadoOCR.textoLeido, resultadoOCR.errorServidor, imagenPreview);
}

function abrirModalRevision(file, parsed, textoLeido, errorServidor, imagenPreview){
  const tipo = (parsed && parsed.tipo) || tipoFormulario;
  const overlay = document.createElement("div");
  overlay.className = "overlay-modal";
  overlay.id = "modalRevision";

  overlay.innerHTML = `
    <div class="modal-panel">
      <h3>📄 Revisa antes de guardar</h3>
      <div class="archivo-nombre">${escapeHtml(file.name)}</div>

      <div class="modal-body">
        <div class="modal-preview">
          ${imagenPreview ? `<img src="${imagenPreview}">` : `<div class="modal-aviso">No se pudo generar una vista previa de la imagen — puedes seguir corrigiendo los datos igual.</div>`}
        </div>

        <div class="modal-fields">
          ${errorServidor ? `<div class="modal-aviso">⚠️ El servidor no pudo leer el documento (${escapeHtml(errorServidor)}). Completa los datos a mano.</div>` : ""}
          ${!errorServidor && (!parsed || !parsed.numero) ? `<div class="modal-aviso">🔍 El OCR no identificó bien el número — revisa y completa a mano.<br><span style="font-family:'IBM Plex Mono',monospace;font-size:10.5px;">${escapeHtml(textoLeido).substring(0,200) || "(no se leyó texto)"}</span></div>` : ""}

          <label>Tipo de carta</label>
          <div class="segmentado">
            <button type="button" id="mTipoRecibida" class="${tipo==='emitida'?'':'on'}" onclick="cambiarTipoModal('recibida')">Recibida</button>
            <button type="button" id="mTipoEmitida" class="${tipo==='emitida'?'on':''}" onclick="cambiarTipoModal('emitida')">Emitida</button>
          </div>

          <label>N° de carta</label>
          <input type="text" id="mNumero" value="${escapeAtributo(parsed && parsed.numero || "")}" inputmode="numeric">

          <label>Fecha</label>
          <input type="date" id="mFecha">

          <label>Asunto</label>
          <textarea id="mAsunto" rows="3">${escapeHtml(parsed && parsed.asunto || "")}</textarea>

          <div id="mWrapEntidad">
            <label id="mLabelEntidad">${tipo === 'emitida' ? 'Dirigida a (entidad)' : 'Entidad remitente'}</label>
            <select id="mEntidad" onchange="autocompletarCodigoModal()">
              <option value="MUNICIPALIDAD DE CIUDAD NUEVA" ${(parsed&&parsed.entidad)==='MUNICIPALIDAD DE CIUDAD NUEVA'?'selected':''}>Municipalidad</option>
              <option value="CONSORCIO ANANEA (SUPERVISION)" ${(parsed&&parsed.entidad)==='CONSORCIO ANANEA (SUPERVISION)'?'selected':''}>Supervisión (Ananea)</option>
              <option value="OTRO">Otro</option>
            </select>
          </div>

          <div id="mWrapCodigo" style="${tipo==='emitida'?'display:none':''}">
            <label>Código (columna B)</label>
            <input type="text" id="mCodigo" placeholder="Ej: GDTI - GM - MDCN - T">
          </div>

          <div id="mWrapInforme" style="${tipo==='emitida'?'':'display:none'}">
            <label>N° Informe (opcional)</label>
            <input type="text" id="mInforme">
          </div>

          <div class="modal-botones">
            <button class="cancelar" onclick="cerrarModalRevision()">Cancelar</button>
            <button class="confirmar" id="btnConfirmarModal" onclick="confirmarGuardarModal()">✅ Guardar carta</button>
          </div>
          <div class="msg-form" id="msgModal"></div>
        </div>
      </div>
    </div>`;

  document.body.appendChild(overlay);
  window._archivoModalActual = file;
  window._tipoModalActual = tipo;
  window._referenciasModalActual = (parsed && parsed.referencias) || "";
  autocompletarCodigoModal();
}

function autocompletarCodigoModal(){
  const entidad = document.getElementById("mEntidad").value;
  const campoCodigo = document.getElementById("mCodigo");
  if(!campoCodigo) return;
  if(entidad === "MUNICIPALIDAD DE CIUDAD NUEVA") campoCodigo.value = "GDTI - GM - MDCN - T";
  else if(entidad === "CONSORCIO ANANEA (SUPERVISION)") campoCodigo.value = "CS-ANANEA";
  else campoCodigo.value = "";
}

function cambiarTipoModal(tipo){
  window._tipoModalActual = tipo;
  document.getElementById("mTipoRecibida").classList.toggle("on", tipo === "recibida");
  document.getElementById("mTipoEmitida").classList.toggle("on", tipo === "emitida");
  document.getElementById("mLabelEntidad").textContent = tipo === "emitida" ? "Dirigida a (entidad)" : "Entidad remitente";
  document.getElementById("mWrapCodigo").style.display = tipo === "emitida" ? "none" : "block";
  document.getElementById("mWrapInforme").style.display = tipo === "emitida" ? "block" : "none";
}

function cerrarModalRevision(){
  const modal = document.getElementById("modalRevision");
  if(modal) modal.remove();
  window._archivoModalActual = null;
}

async function confirmarGuardarModal(){
  if(!pinSesion){ alert("Sesión sin PIN — cierra este panel y vuelve a entrar."); return; }

  const numero = document.getElementById("mNumero").value.trim();
  const fechaISO = document.getElementById("mFecha").value;
  const asunto = document.getElementById("mAsunto").value.trim();
  const entidad = document.getElementById("mEntidad").value;
  const tipo = window._tipoModalActual;
  const msg = document.getElementById("msgModal");

  if(!numero){ msg.textContent = "Falta el N° de carta."; msg.className = "msg-form err"; return; }

  const btn = document.getElementById("btnConfirmarModal");
  btn.disabled = true; btn.textContent = "Guardando...";

  try {
    let fecha = "DD/MM/" + new Date().getFullYear();
    if(fechaISO){ const [a,m,d] = fechaISO.split("-"); fecha = `${d}/${m}/${a}`; }

    const body = { accion: "guardarCarta", pin: pinSesion, tipo, numero, fecha, asunto, entidad, referencias: window._referenciasModalActual || "" };
    if(tipo === "emitida"){
      body.informe = document.getElementById("mInforme").value.trim();
    } else {
      body.codigoDe = document.getElementById("mCodigo").value.trim();
    }
    if(window._archivoModalActual){
      body.archivoBase64 = await archivoABase64(window._archivoModalActual);
      body.mimeType = window._archivoModalActual.type || "application/pdf";
    }

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "Error desconocido");

    tipoFormulario = tipo;
    cerrarModalRevision();
    await cargarDatos();
    renderFormulario(document.getElementById("main"));
  } catch (err) {
    msg.textContent = "❌ " + err.message;
    msg.className = "msg-form err";
    btn.disabled = false; btn.textContent = "✅ Guardar carta";
  }
}

function archivoABase64(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function autoguardarFila(key){
  const tr = document.querySelector(`tr[data-key="${key}"]`);
  if(!tr) return;
  const cols = COLUMNAS[tipoFormulario];
  const valores = {};
  cols.forEach(c => { valores[c.key] = tr.querySelector(".c-" + c.key).value.trim(); });

  if(!valores.numero) return; // todavía no hay nada que guardar en esa fila
  if(!pinSesion){ alert("Sesión sin PIN — vuelve a entrar al panel."); panelDesbloqueado = false; renderFormulario(document.getElementById("main")); return; }

  tr.style.transition = "background-color .3s";
  tr.style.backgroundColor = "#EAF3FD"; // guardando...

  try {
    const body = { accion: "guardarCarta", pin: pinSesion, tipo: tipoFormulario, numero: valores.numero, fecha: valores.fecha || ("DD/MM/" + new Date().getFullYear()), asunto: valores.asunto, entidad: valores.entidad };
    if(tipoFormulario === "emitida"){ body.fechaRealizado = valores.fechaRealizado; body.informe = valores.informe; }
    else { body.codigoDe = valores.codigoDe; body.para = valores.para; }

    if(archivosPendientes[key]){
      body.archivoBase64 = await archivoABase64(archivosPendientes[key]);
      body.mimeType = archivosPendientes[key].type || "application/pdf";
    }

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if(!data.ok) throw new Error(data.error || "Error desconocido");

    if(data.link) tr.querySelector(".c-link").value = data.link;
    delete archivosPendientes[key];
    tr.style.backgroundColor = "#D6EAFB";
    setTimeout(() => { tr.style.backgroundColor = ""; }, 900);

    if(key.startsWith("nueva_")){
      const idx = parseInt(key.split("_")[1], 10);
      const guardada = { ...valores, link: data.link || valores.link };
      filasNuevas.splice(idx, 1);
      if(tipoFormulario === "emitida") DATA.emitidas.push(guardada); else DATA.recibidas.push(guardada);
      renderFormulario(document.getElementById("main")); // recién aquí sí, la fila cambió de sección
    }
  } catch (err) {
    tr.style.backgroundColor = "#FBDCDC";
    alert("No se pudo guardar esa fila: " + err.message);
  }
}

cargarDatos();

// Botón flotante ir arriba/abajo — solo útil (y visible) en el panel de agregar, donde la tabla es larga
const btnScroll = document.getElementById("btnScroll");
function actualizarBotonScroll(){
  if(currentTab !== "editar"){ btnScroll.style.display = "none"; return; }
  btnScroll.style.display = "block";
  const cercaDelFinal = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 80);
  btnScroll.textContent = cercaDelFinal ? "↑" : "↓";
}
function toggleScroll(){
  const cercaDelFinal = (window.innerHeight + window.scrollY) >= (document.body.scrollHeight - 80);
  window.scrollTo({ top: cercaDelFinal ? 0 : document.body.scrollHeight, behavior: "smooth" });
}
window.addEventListener("scroll", actualizarBotonScroll);
window.addEventListener("resize", actualizarBotonScroll);

// Evita que el navegador abra/navegue al archivo si se suelta cerca pero fuera de la zona de arrastre
["dragover", "drop"].forEach(ev => {
  window.addEventListener(ev, (e) => {
    if(!e.target.closest || !e.target.closest("#dropzone")) e.preventDefault();
  });
});

if("serviceWorker" in navigator){
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
